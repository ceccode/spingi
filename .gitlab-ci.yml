# CI: every commit runs the runtime lint and tests on CPU, without a GPU or a robot.
# The viewer gets its own job once its code exists.
image: python:3.12-slim

stages: [test]

runtime:
  stage: test
  before_script:
    - pip install uv
    - cd runtime && uv sync --extra dev --extra sim --extra export
  script:
    - uv run ruff check spingi tests scripts
    - uv run pytest
