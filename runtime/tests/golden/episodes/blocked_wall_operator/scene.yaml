# Like lab_small, but with a wall between the dock and workstation_B: the robot stops against the obstacle.
robot:
  pose: { x: 0.0, y: 0.0, yaw: 0.0 }
  battery_pct: 100
locations:
  dock:          { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }
  shelf_A:       { pose: { x: 0.0, y: 2.0, yaw: 1.57 } }
  workstation_B: { pose: { x: 6.0, y: 0.5, yaw: 0.0 } }
obstacles:
  - { x: 3.0, y: 0.25, w: 0.3, d: 6.0, h: 1.5 }
safety:
  geofence: { x_min: -1.0, x_max: 8.0, y_min: -3.0, y_max: 5.0 }
  max_speed: 0.8
  min_battery_pct: 5
