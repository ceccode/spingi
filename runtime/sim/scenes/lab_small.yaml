# Lab scene: four known waypoints, one obstacle off the path. Used by the CLI and the tests.
robot:
  pose: { x: 0.0, y: 0.0, yaw: 0.0 }
  battery_pct: 100
locations:
  dock:          { pose: { x: 0.0, y: 0.0, yaw: 0.0 } }
  shelf_A:       { pose: { x: 0.0, y: 2.0, yaw: 1.57 } }
  workstation_B: { pose: { x: 6.0, y: 0.5, yaw: 0.0 } }
  panel_C:       { pose: { x: 6.0, y: 3.0, yaw: 3.14 }, tolerance_m: 0.2 }
obstacles:
  - { x: 3.0, y: -1.5, w: 0.8, d: 0.8, h: 1.2 }   # column off the path
  - { x: 0.0, y: 2.9, w: 1.2, d: 0.4, h: 0.85 }   # shelf A, the box sits on top of it
objects:
  red_box_01: { cls: red_box, marker_id: 7, pose: { x: 0.0, y: 2.9, z: 0.90 } }
# AprilTags at known places, for the robot to correct its drifting pose estimate (ADR-0016). `facing` is where the
# tag looks; `post: false` is a tag flat on a surface (the column).
landmarks:
  - { marker_id: 10, x: 2.59, y: -1.3, facing: 3.1416, size_m: 0.3, post: false }   # on the column, seen from the dock
  - { marker_id: 11, x: 8.5, y: -0.6, facing: 2.727, size_m: 0.3 }                  # seen from workstation B
  - { marker_id: 12, x: 3.6, y: 3.9, facing: -0.359, size_m: 0.3 }                  # seen from panel C
safety:
  geofence: { x_min: -1.0, x_max: 8.0, y_min: -3.0, y_max: 5.0 }
  max_speed: 0.8
  min_battery_pct: 5
