[project]
name = "spingi"
version = "0.1.0"
description = "Physical Agent Runtime: a reliable executor of simple physical tasks for humanoid robots, developed sim-first."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["../LICENSE"]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
sim = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
]
export = [
    "pandas>=2.1",
    "pyarrow>=15",
]
llm = [
    "anthropic>=0.70",
]

[project.scripts]
spingi = "spingi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spingi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
