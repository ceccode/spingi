[project]
name = "spingi"
version = "0.2.0"
description = "Physical Agent Runtime: a reliable executor of simple physical tasks for legged robots, humanoids and quadrupeds, developed sim-first."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]  # copies of the repository root files, kept equal by a test
authors = [{ name = "Spingi contributors" }]
keywords = [
  "robotics", "physical-ai", "embodied-ai", "humanoid", "quadruped", "legged-robots", "unitree",
  "mujoco", "simulation", "robot-safety", "mcp", "model-context-protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
sim = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pillow>=10.1",  # the scene map (ADR-0028); its built-in scalable font arrived in 10.1
    "scipy>=1.11",
    "trimesh>=4.4",
]
export = [
    "pandas>=2.1",
    "pyarrow>=15",
]
llm = [
    "anthropic>=0.70",
]
perception = [
    "opencv-python-headless>=4.9",
]
# The MCP server for coding agents (ADR-0030), with everything its tools can ask of the simulator.
mcp = [
    "mcp>=2.3,<3",
    "spingi[sim,perception]",
]

[project.urls]
Homepage = "https://github.com/ceccode/spingi"
Tutorial = "https://github.com/ceccode/spingi/blob/main/docs/tutorial.md"
"Coding agents (MCP)" = "https://github.com/ceccode/spingi/blob/main/docs/agents.md"
Viewer = "https://spingi-viewer.netlify.app"
Changelog = "https://github.com/ceccode/spingi/blob/main/CHANGELOG.md"
Issues = "https://github.com/ceccode/spingi/issues"

[project.scripts]
spingi = "spingi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spingi"]

# The simulator's assets and the samples sit next to the package in a checkout. The wheel carries them inside it,
# under spingi/_assets, where spingi.assets looks first (ADR-0027). Each model and policy folder has its license.
[tool.hatch.build.targets.wheel.force-include]
"sim/models" = "spingi/_assets/sim/models"
"sim/policies" = "spingi/_assets/sim/policies"
"sim/markers" = "spingi/_assets/sim/markers"
"sim/scenes" = "spingi/_assets/sim/scenes"
"plans" = "spingi/_assets/plans"

[tool.hatch.build.targets.sdist]
include = ["/spingi", "/sim", "/plans", "/README.md", "/LICENSE", "/NOTICE"]
exclude = ["_gen_*.xml", ".DS_Store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I imports, B bugbear, UP pyupgrade, S bandit (security), ASYNC asyncio pitfalls,
# SIM simplifications, RUF ruff-specific, PIE misc., BLE blind except (each one must say why).
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PIE", "BLE"]
ignore = [
  "S311",    # pseudo-random numbers are simulated sensor noise, not cryptography
  "RUF001", "RUF002", "RUF003",  # typographic characters in strings and comments are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "RUF059", "ASYNC240"]   # pytest asserts, temp paths, unused fixtures, test I/O
