[project]
name = "spingi"
version = "0.1.0"
description = "Physical Agent Runtime: a reliable executor of simple physical tasks for humanoid robots, developed sim-first."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]  # copies of the repository root files, kept equal by a test
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
sim = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
]
export = [
    "pandas>=2.1",
    "pyarrow>=15",
]
llm = [
    "anthropic>=0.70",
]
perception = [
    "opencv-python-headless>=4.9",
]

[project.scripts]
spingi = "spingi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spingi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I imports, B bugbear, UP pyupgrade, S bandit (security), ASYNC asyncio pitfalls,
# SIM simplifications, RUF ruff-specific, PIE misc., BLE blind except (each one must say why).
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PIE", "BLE"]
ignore = [
  "S311",    # pseudo-random numbers are simulated sensor noise, not cryptography
  "RUF001", "RUF002", "RUF003",  # typographic characters in strings and comments are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "RUF059", "ASYNC240"]   # pytest asserts, temp paths, unused fixtures, test I/O
