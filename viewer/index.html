<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spingi Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <strong>Spingi Viewer</strong>
        <span id="title" class="muted">no episode loaded</span>
        <span class="spacer"></span>
        <label class="btn">Load .zip<input id="file" type="file" accept=".zip" hidden /></label>
        <select id="sample" class="btn">
          <option value="">Sample episodes…</option>
          <option value="demo_inspection_round">Inspection round (lab, G1)</option>
          <option value="demo_inspection_round_go2">Inspection round (lab, Go2)</option>
          <option value="demo_material_runner">Material runner (warehouse)</option>
          <option value="yard_patrol_go2_realistic">Yard patrol (outdoors, Go2, realistic sensors)</option>
          <option value="test_track_g1_physics">Test track (G1, physics)</option>
          <option value="demo_inspection_round_g1_physics">Inspection round (lab, G1, physics)</option>
        </select>
      </header>
      <main>
        <div id="viewport">
          <canvas id="canvas"></canvas>
          <div id="drop" class="drop">Drop an episode (.zip) here</div>
          <div id="hud" class="hud"></div>
          <figure id="fpv" class="fpv" title="What the head camera saw · click to enlarge" hidden>
            <video id="fpvVideo" muted playsinline preload="auto"></video>
            <figcaption id="fpvLabel" class="fpv-label"></figcaption>
          </figure>
        </div>
        <aside id="side">
          <section id="manifest" class="card"></section>
          <section class="card grow">
            <h3>Events</h3>
            <ol id="events"></ol>
          </section>
          <section id="framesCard" class="card" hidden>
            <h3>Frames analysed</h3>
            <img id="frameLarge" class="frame-large" alt="latest frame the robot analysed" hidden />
            <p id="frameCaption" class="muted small"></p>
            <div id="frames" class="frames"></div>
          </section>
        </aside>
      </main>
      <footer id="timeline">
        <button id="play" type="button" class="btn" disabled>▶</button>
        <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" disabled />
        <span id="clock" class="mono">0.0 s</span>
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <label class="chk"><input id="follow" type="checkbox" checked /> follow robot</label>
        <label class="chk" title="the head camera's video, for episodes recorded with --camera-video"><input id="robotView" type="checkbox" checked disabled /> robot's view</label>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
