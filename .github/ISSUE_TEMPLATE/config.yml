blank_issues_enabled: true
contact_links:
  - name: Security or safety problem
    url: https://github.com/ceccode/spingi/security/advisories/new
    about: A vulnerability, or a way to make the robot move when it should not. Reported privately, never as a public issue.
  - name: Question or idea to talk about
    url: https://github.com/ceccode/spingi/discussions
    about: How to do something with Spingi, or a thought that is not yet a proposal.
