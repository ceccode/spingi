# Lint and tests of both projects on every push and pull request. No GPU, no robot, no network calls to Claude.
# Actions are pinned to commit SHAs (the comment gives the tag); permissions are read-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    env:
      MUJOCO_GL: egl  # offscreen rendering without a display; rendering tests skip themselves if unavailable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: Install system libraries for MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglvnd0
      - name: Install
        run: uv sync --locked --extra dev --extra sim --extra export --extra llm
      - name: Lint
        run: uv run ruff check spingi tests scripts
      - name: Format
        run: uv run ruff format --check spingi tests scripts
      - name: Tests
        run: uv run pytest

  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
